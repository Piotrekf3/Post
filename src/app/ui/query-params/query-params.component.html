<p-table
  [columns]="cols"
  [value]="queryParams"
  [tableStyle]="{ 'min-width': '50rem' }"
  [rowTrackBy]="trackByFunction"
>
  <ng-template pTemplate="header" let-columns>
    <tr>
      <th *ngFor="let col of columns" style="width: 25%">
        {{ col.header }}
      </th>
    </tr>
  </ng-template>
  <ng-template
    pTemplate="body"
    let-queryParam
    let-columns="columns"
    let-editing="editing"
  >
    <tr>
      <td
        *ngFor="let col of columns"
        [pEditableColumn]="queryParam[col.field]"
        [pEditableColumnField]="col.field"
      >
        <p-cellEditor>
          <ng-template pTemplate="input">
            <input
              pInputText
              type="text"
              [(ngModel)]="queryParam[col.field]"
              (ngModelChange)="onFieldChange()"
            />
          </ng-template>
          <ng-template pTemplate="output">
            {{ queryParam[col.field] }}
          </ng-template>
        </p-cellEditor>
      </td>
    </tr>
  </ng-template>
</p-table>
